[project]
name = "pororoca"
version = "0.1.0"
description = "Volatility connectedness across the four submarkets of the Brazilian power system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Francisco Rolotti" }]
keywords = ["electricity", "brazil", "volatility", "spillovers", "diebold-yilmaz", "pld", "ons"]
dependencies = [
    "connectedness>=0.1.0a2",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pororoca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
